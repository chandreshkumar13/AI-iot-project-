{% extends 'base.html' %}
{% block title %}Error {{code}}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size:4rem;"></i>
    <h1 class="display-1 fw-bold text-danger">{{code}}</h1>
    <h4 class="mb-4">{{message}}</h4>
    <a href="{{url_for('index')}}" class="btn btn-success">Go Home</a>
  </div>
</div>
{% endblock %}
