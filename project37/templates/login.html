{% extends 'base.html' %}
{% block title %}Login — CSI Detector{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card csi-card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-success" style="font-size:2.5rem;"></i>
        <h3 class="mt-2 fw-bold">Sign In</h3>
        <p class="text-muted small">Access the CSI Detection Dashboard</p>
      </div>
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required/>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" name="remember" class="form-check-input" id="remember"/>
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>
      <hr class="my-3"/>
      <p class="text-center text-muted small mb-0">
        No account? <a href="{{ url_for('auth.register') }}" class="text-success">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
