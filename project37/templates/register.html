{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
<div class="col-md-6 col-lg-5"><div class="card csi-card p-4">
<div class="text-center mb-4"><i class="bi bi-person-plus-fill text-success" style="font-size:2.5rem;"></i>
<h3 class="mt-2 fw-bold">Create Account</h3>
<p class="text-muted small">Join the CSI Detection System</p></div>
<form method="POST">
<div class="mb-3"><label class="form-label">Username</label>
<input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus/></div>
<div class="mb-3"><label class="form-label">Email</label>
<input type="email" name="email" class="form-control" required/></div>
<div class="mb-3"><label class="form-label">Role</label>
<select name="role" class="form-select">
<option value="viewer">Viewer (Read-only)</option>
<option value="operator">Operator (View + Alerts)</option>
<option value="admin">Admin (Requires approval)</option>
</select></div>
<div class="mb-3"><label class="form-label">Password</label>
<input type="password" name="password" class="form-control" placeholder="Min 6 chars" required/></div>
<div class="mb-4"><label class="form-label">Confirm Password</label>
<input type="password" name="confirm_password" class="form-control" required/></div>
<button type="submit" class="btn btn-success w-100 fw-bold">Create Account</button>
</form><hr class="my-3"/>
<p class="text-center small">Already registered? <a href="/auth/login" class="text-success">Login</a></p>
</div></div></div>
{% endblock %}
